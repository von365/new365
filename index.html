<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Grand+Hotel&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" aria-label="Primary">
    <div class="sidebar-inner">
      <a href="#" class="brand" aria-label="Instagram home">
        <span class="brand-full">Instagram</span>
        <span class="brand-mini" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        </span>
      </a>

      <nav class="nav">
        <a class="nav-item active" href="#">
          <svg viewBox="0 0 24 24" class="ico"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
          <span>Home</span>
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search</span>
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 2a10 10 0 1 0 10 10c0-2.5-1-5-3-7"/><path d="m9 12 2 2 4-4"/></svg>
          <span>Explore</span>
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m10 8 6 4-6 4z" fill="currentColor"/></svg>
          <span>Reels</span>
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" class="ico"><path d="M21 12a8 8 0 0 1-12.5 6.6L3 20l1.4-5.5A8 8 0 1 1 21 12z"/></svg>
          <span>Messages</span>
          <span class="badge">3</span>
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 21s-7-4.5-9-9.5A5 5 0 0 1 12 6a5 5 0 0 1 9 5.5C19 16.5 12 21 12 21z"/></svg>
          <span>Notifications</span>
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M12 8v8"/></svg>
          <span>Create</span>
        </a>
        <a class="nav-item" href="#">
          <span class="avatar nav-avatar" style="background-image:url('https://i.pravatar.cc/80?img=12')"></span>
          <span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item more" type="button">
          <svg viewBox="0 0 24 24" class="ico"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          <span>More</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <!-- STORIES -->
    <section class="stories" aria-label="Stories">
      <button class="story-scroll left" type="button" aria-label="Scroll left">
        <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <div class="stories-track" id="storiesTrack">
        <!-- stories injected by JS -->
      </div>
      <button class="story-scroll right" type="button" aria-label="Scroll right">
        <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </section>

    <!-- FEED -->
    <section class="feed" id="feed" aria-label="Posts">
      <!-- posts injected by JS -->
    </section>
  </main>

  <!-- RIGHT RAIL -->
  <aside class="rail" aria-label="Suggestions">
    <div class="me">
      <span class="avatar lg" style="background-image:url('https://i.pravatar.cc/120?img=12')"></span>
      <div class="me-text">
        <div class="me-name">you_design</div>
        <div class="me-sub">Alex Johnson</div>
      </div>
      <button class="link-btn">Switch</button>
    </div>

    <div class="rail-section">
      <div class="rail-head">
        <span>Suggested for you</span>
        <a href="#" class="see-all">See all</a>
      </div>
      <ul class="suggestions" id="suggestions">
        <!-- suggestions injected by JS -->
      </ul>
    </div>

    <footer class="rail-footer">
      <p>About · Help · Press · API · Jobs · Privacy · Terms · Locations · Language · Meta Verified</p>
      <p class="copy">© 2026 INSTAGRAM CLONE</p>
    </footer>
  </aside>

  <!-- BOTTOM NAV (mobile) -->
  <nav class="bottom-nav" aria-label="Mobile">
    <a href="#" class="active"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
    <a href="#"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M12 8v8"/></svg></a>
    <a href="#"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m10 8 6 4-6 4z" fill="currentColor"/></svg></a>
    <a href="#"><span class="avatar sm" style="background-image:url('https://i.pravatar.cc/40?img=12')"></span></a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
